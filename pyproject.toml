[project]
name = "sentinel-orchestrator"
version = "0.2.0"
description = "Telegram loan-underwriting agent: LangGraph interview -> credit-risk model -> plain-English explanation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # bot + agent
    "langgraph>=0.6",
    "langchain-openai>=0.3",
    "python-telegram-bot>=21.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # scoring service (scikit-learn pinned to the version the model was saved with)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "joblib>=1.4",
    "scikit-learn==1.7.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
