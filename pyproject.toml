[project]
name = "sentinel-orchestrator"
version = "0.2.0"
description = "Telegram loan-underwriting agent: LangGraph interview -> credit-risk model -> plain-English explanation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # bot + agent
    "langgraph>=0.6",
    "langchain-openai>=0.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # scoring service (scikit-learn pinned to the version the model was saved with)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "joblib>=1.4",
    "scikit-learn==1.7.2",
    "langfuse>=5",
    "langgraph-checkpoint-sqlite>=3",
    "aiosqlite>=0.22.1",
    "tenacity>=9",
    "prometheus-client>=0.26",
    "langgraph-checkpoint-aws>=1.2",
    "boto3>=1.43",
]

[dependency-groups]
dev = [
    "moto[cloudwatch,dynamodb,secretsmanager]>=5",
    "mypy>=2.4.1",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.17.3",
]
infra = [
    "aws-cdk-lib==2.266.0",
    "constructs>=10",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["eval: runs against the real LLM (costs money)"]
addopts = "-m 'not eval'"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["_scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "UP007", "UP045"]

[tool.mypy]
python_version = "3.12"
packages = ["sentinel"]
ignore_missing_imports = true
check_untyped_defs = true
