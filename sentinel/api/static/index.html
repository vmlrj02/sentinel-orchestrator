<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel Loan Assistant</title>
<meta name="description" content="Apply for a personal loan in a short chat, or ask about the lender's policies.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23215f4f'/><path d='M16 6l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V9z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M16 6l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V9z"/></svg>
    <div><strong>Sentinel</strong><span>Loan assistant</span></div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="chat-col">
      <div id="thread" class="thread" aria-live="polite"></div>
      <div class="suggestions" id="suggestions"></div>
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Type a message…" maxlength="1000" aria-label="Message"></textarea>
        <button type="submit" id="send" aria-label="Send">Send</button>
      </form>
      <div class="footer-row">
        <span class="muted small">Demo with a fictional lender. Please use made-up details.</span>
        <button class="link-button small" id="new-app" type="button">Start over</button>
      </div>
    </div>
  </section>
</main>

<template id="citation-tpl"><details class="citation"><summary></summary><p></p></details></template>
<script src="/static/app.js"></script>
</body>
</html>
