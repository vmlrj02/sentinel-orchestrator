name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Unit and integration tests (fake LLM, no network)
        run: uv run pytest -q
      - name: Policy index is up to date with the documents
        run: |
          uv run python - <<'EOF'
          import json
          from sentinel.rag import INDEX_PATH, corpus_hash, load_chunks
          index = json.loads(INDEX_PATH.read_text())
          assert index["corpus_hash"] == corpus_hash(load_chunks()), "Run `python -m sentinel.rag` and commit index.json"
          EOF
